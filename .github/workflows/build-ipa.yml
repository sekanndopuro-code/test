# MalodySlideEditor を GitHub の Mac で自動ビルドして、SideStore 用の ipa を作る設定ファイルです。
# このファイルは、リポジトリの  .github/workflows/build-ipa.yml  という場所に置きます。
#
# 動くタイミング:
#   1) main ブランチに変更を保存(Commit)したとき  2) Actions タブの「Run workflow」ボタンを押したとき
# 結果:
#   リポジトリの Releases に「latest」が作られ、その中に MalodySlideEditor.ipa が入ります。

name: ipaを作る

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write        # Releases に ipa を載せるために必要

jobs:
  build:
    runs-on: macos-15    # GitHub が貸してくれる Mac (Xcode 入り)
    timeout-minutes: 30

    steps:
      - name: ソースを取ってくる
        uses: actions/checkout@v4

      - name: Xcode のバージョンを表示
        run: xcodebuild -version

      - name: ビルド (署名なし)
        run: |
          set -o pipefail
          xcodebuild build \
            -scheme MalodySlideEditor \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            2>&1 | tee build.log

      # xcodebuild は Swift Playgrounds 形式のパッケージから「実行ファイル」までしか作ってくれず、
      # .app (アプリの入れ物) は作ってくれない。なので、.app は自分で組み立てる。
      - name: 実行ファイルから .app を組み立てて ipa にまとめる
        run: |
          BIN=build/Build/Products/Release-iphoneos/MalodySlideEditor
          if [ ! -f "$BIN" ]; then
            echo "error: 実行ファイルが見つかりません: $BIN"
            find build/Build/Products -maxdepth 3 || true
            exit 1
          fi
          file "$BIN"
          rm -rf Payload MalodySlideEditor.ipa
          mkdir -p Payload/MalodySlideEditor.app
          cp "$BIN" Payload/MalodySlideEditor.app/MalodySlideEditor
          chmod +x Payload/MalodySlideEditor.app/MalodySlideEditor
          cat > Payload/MalodySlideEditor.app/Info.plist <<'PLISTEOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleDevelopmentRegion</key><string>en</string>
            <key>CFBundleExecutable</key><string>MalodySlideEditor</string>
            <key>CFBundleIdentifier</key><string>local.malody.slideeditor</string>
            <key>CFBundleInfoDictionaryVersion</key><string>6.0</string>
            <key>CFBundleName</key><string>MalodySlideEditor</string>
            <key>CFBundleDisplayName</key><string>MalodySlideEditor</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>1.0</string>
            <key>CFBundleVersion</key><string>1</string>
            <key>CFBundleSupportedPlatforms</key><array><string>iPhoneOS</string></array>
            <key>MinimumOSVersion</key><string>16.0</string>
            <key>LSRequiresIPhoneOS</key><true/>
            <key>UIDeviceFamily</key><array><integer>1</integer><integer>2</integer></array>
            <key>UIRequiredDeviceCapabilities</key><array><string>arm64</string></array>
            <key>UILaunchScreen</key><dict/>
            <key>UISupportedInterfaceOrientations</key>
            <array>
              <string>UIInterfaceOrientationLandscapeRight</string>
              <string>UIInterfaceOrientationLandscapeLeft</string>
            </array>
            <key>UISupportedInterfaceOrientations~ipad</key>
            <array>
              <string>UIInterfaceOrientationLandscapeRight</string>
              <string>UIInterfaceOrientationLandscapeLeft</string>
            </array>
          </dict>
          </plist>
          PLISTEOF
          plutil -lint Payload/MalodySlideEditor.app/Info.plist
          zip -qry MalodySlideEditor.ipa Payload
          ls -lh MalodySlideEditor.ipa

      - name: Releases に載せる (ipa を直接ダウンロードできるようにする)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest MalodySlideEditor.ipa \
            --target "$GITHUB_SHA" \
            --title "最新ビルド" \
            --notes "SideStore で入れる用の ipa です (署名なし)。"

      - name: ipa を Actions の成果物としても保存 (予備)
        uses: actions/upload-artifact@v4
        with:
          name: MalodySlideEditor-ipa
          path: MalodySlideEditor.ipa

      # 失敗したときだけ動く。ここに出る文章を、そのままコピーして Claude に貼ってください
      - name: 失敗したときの要点
        if: failure()
        run: |
          echo "=== error の行 ==="
          grep -n "error:" build.log | head -40 || true
          echo "=== ログの最後 40 行 ==="
          tail -40 build.log || true

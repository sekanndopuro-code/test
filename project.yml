# MalodySlideEditor の XcodeGen 設定ファイルです。
# GitHub Actions が `xcodegen generate` でこのファイルから MalodySlideEditor.xcodeproj と
# Generated/Info.plist を作り、xcodebuild でビルドします (Mac が無くても ipa が作れる)。
#
# - Package.swift は Swift Playgrounds で開く用です。この project.yml とは独立していて、
#   お互いに影響しません (xcodebuild には -project を明示しているので Package.swift は読まれません)。
# - Vendor/CRubberBand は、リポジトリには置かず、Actions が Rubber Band v4.0.0 を取ってきて作ります。
#   (.github/workflows/build-ipa.yml の「Rubber Band を取り込む」)
#   なので、Playgrounds で開いたときは Rubber Band なし (自前のフェーズボコーダー) になります。
# - stb_vorbis (ogg Vorbis を読む C の公開ライブラリ) は、リポジトリ直下の stb_vorbis.c をそのまま置いてあります。
#   StbVorbisBridge.c / StbVorbisBridge.h が Swift との橋渡しで、下の SWIFT_OBJC_BRIDGING_HEADER と
#   HAVE_STB_VORBIS (Swift の #if) で有効になります。Playgrounds (Package.swift) では C は入らず、従来の自前 ogg デコーダーで読みます。

name: MalodySlideEditor

schemes:
  # xcodebuild archive -scheme MalodySlideEditor で使う共有スキーム。
  # この版の XcodeGen はスキームを自動では作らないので、明示しておく。
  MalodySlideEditor:
    build:
      targets:
        MalodySlideEditor: all
    archive:
      config: Release

targets:
  MalodySlideEditor:
    type: application
    platform: iOS
    deploymentTarget: "16.0"

    sources:
      # リポジトリ直下の Swift ファイルだけを取り込む。
      # (Package.swift は Playgrounds 用なので除外。Vendor/ README.md なども対象外)
      - path: .
        includes:
          - "*.swift"
        excludes:
          - "Package.swift"
      # stb_vorbis の橋渡し (C)。中で stb_vorbis.c を #include するので、stb_vorbis.c 自体はここに書かない
      # (書くと同じ関数が 2 回できてリンクに失敗する)。-w は、stb_vorbis.c が出す古い書き方の警告を消すだけ。
      - path: StbVorbisBridge.c
        compilerFlags:
          - "-w"
      # Rubber Band 本体。1 ファイルにまとめたビルド用ファイルだけをコンパイルする。
      # (中で ../src/... を相対 include しているので、Vendor/CRubberBand の配置は変えないこと)
      - path: Vendor/CRubberBand/single/RubberBandSingle.cpp
      # アプリアイコン。リポジトリ直下の AppIcon-1024.png (1024px・透明なし) から、
      # Actions が Assets.xcassets/AppIcon.appiconset を作る (.github/workflows/build-ipa.yml の「アプリアイコンを用意する」)。
      # (iPad から階層フォルダをアップロードするのは大変なので、PNG は 1 枚だけをルートに置く方式にしている)
      - path: Assets.xcassets

    dependencies:
      # Rubber Band (vDSP FFT) が使う。
      - sdk: Accelerate.framework

    # Info.plist はここから生成する。
    # CFBundleIdentifier / CFBundleExecutable / CFBundlePackageType などは XcodeGen が自動で入れる。
    # CFBundleSupportedPlatforms / MinimumOSVersion / UIDeviceFamily は、ビルド時に Xcode が
    # 下の deploymentTarget と TARGETED_DEVICE_FAMILY から入れる。
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDevelopmentRegion: en
        CFBundleName: MalodySlideEditor
        CFBundleDisplayName: MalodySlideEditor
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        LSRequiresIPhoneOS: true
        UIRequiredDeviceCapabilities:
          - arm64
        UILaunchScreen: {}
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationLandscapeRight
          - UIInterfaceOrientationLandscapeLeft
        "UISupportedInterfaceOrientations~ipad":
          - UIInterfaceOrientationLandscapeRight
          - UIInterfaceOrientationLandscapeLeft

        # --- .mc / .mcz を「このアプリで開く」候補に出すための登録 ---
        # (Malody 本家など他のアプリを奪わないよう、LSHandlerRank は Alternate にしてある)
        CFBundleDocumentTypes:
          - CFBundleTypeName: Malody 譜面
            CFBundleTypeRole: Editor
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - local.malody.slideeditor.mc
              - local.malody.slideeditor.mcz
        # .mc / .mcz は Malody 側の形式なので「自分のもの」ではなく Imported として宣言する。
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: local.malody.slideeditor.mc
            UTTypeDescription: Malody 譜面 (.mc)
            UTTypeConformsTo:
              - public.data
            UTTypeTagSpecification:
              public.filename-extension:
                - mc
          - UTTypeIdentifier: local.malody.slideeditor.mcz
            UTTypeDescription: Malody 譜面パッケージ (.mcz)
            UTTypeConformsTo:
              - public.data
            UTTypeTagSpecification:
              public.filename-extension:
                - mcz

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.malody.slideeditor
        PRODUCT_NAME: MalodySlideEditor
        TARGETED_DEVICE_FAMILY: "1,2"     # 1 = iPhone, 2 = iPad
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

        # --- Rubber Band (C++) をこのターゲットに入れるための設定 ---
        CLANG_CXX_LANGUAGE_STANDARD: c++17
        CLANG_CXX_LIBRARY: libc++
        GCC_PREPROCESSOR_DEFINITIONS:
          - "$(inherited)"
          - NDEBUG
        HEADER_SEARCH_PATHS:
          - "$(inherited)"
          - "$(SRCROOT)/Vendor/CRubberBand"
        OTHER_LDFLAGS:
          - "$(inherited)"
          - "-lc++"

        # Swift から `import CRubberBand` できるようにする (Vendor/CRubberBand/include/module.modulemap)。
        # Swift Package Manager が内部でやっているのと同じ指定 (-I と -fmodule-map-file の両方)。
        SWIFT_INCLUDE_PATHS:
          - "$(inherited)"
          - "$(SRCROOT)/Vendor/CRubberBand/include"
        OTHER_SWIFT_FLAGS:
          - "$(inherited)"
          - "-Xcc"
          - "-fmodule-map-file=$(SRCROOT)/Vendor/CRubberBand/include/module.modulemap"
        # 従来方式 (implicit modules) に固定して、モジュール解決の挙動を安定させる。
        SWIFT_ENABLE_EXPLICIT_MODULES: "NO"

        # --- stb_vorbis (C) を Swift から使うための設定 ---
        # ブリッジングヘッダー: Swift から msd_vorbis_decode() が見えるようになる (StbVorbisBridge.h)。
        SWIFT_OBJC_BRIDGING_HEADER: StbVorbisBridge.h
        # Swift 側の #if HAVE_STB_VORBIS を有効にする (Playgrounds ではこれが無いので、従来の自前 ogg デコーダーになる)。
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) HAVE_STB_VORBIS"
